<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sangeetha | Graphic &amp; Visual Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090b10;
      --surface: #111622;
      --surface-2: #171e2e;
      --img-bg: #0c1019;
      --text: #f5f7fc;
      --muted: #a4b0c6;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 92, 255, 0.14), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(34, 211, 238, 0.10), transparent 35%),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(9, 11, 16, 0.82);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 72px;
    }
    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--text);
    }
    .brand span { color: var(--accent-2); }
    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--text); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.94rem;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #080a0f;
      box-shadow: 0 10px 24px rgba(124, 92, 255, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }
    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    /* Hero */
    .hero { padding: 88px 0 72px; }
    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.14);
      color: #c8b9ff;
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 20px;
      border: 1px solid rgba(124, 92, 255, 0.35);
    }
    h1 {
      font-size: clamp(2.25rem, 5vw, 3.7rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 820px;
      margin-bottom: 20px;
    }
    .hero p {
      color: var(--muted);
      max-width: 650px;
      font-size: 1.06rem;
      margin-bottom: 30px;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    /* Sections */
    section {
      padding: 72px 0;
      border-top: 1px solid var(--border);
    }
    .sec-head { margin-bottom: 34px; }
    .sec-head span {
      color: var(--accent-2);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .sec-head h2 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 6px;
    }

    /* About & Skills */
    .about-text {
      color: var(--muted);
      max-width: 740px;
      font-size: 1.02rem;
    }
    .skills-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .skill-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 0.86rem;
      color: #d6deee;
      font-weight: 500;
    }

    /* Portfolio Grid */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 26px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(124, 92, 255, 0.45);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    /* Full uncropped image container */
    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--img-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      cursor: zoom-in;
      overflow: hidden;
    }
    .card-img-wrapper img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      transition: transform 0.25s ease;
    }
    .card:hover .card-img-wrapper img {
      transform: scale(1.03);
    }

    .card-content {
      padding: 22px 24px 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .tag {
      align-self: flex-start;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--accent-2);
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card p {
      color: var(--muted);
      font-size: 0.93rem;
      margin-bottom: 14px;
    }
    .preview-link {
      margin-top: auto;
      background: none;
      border: none;
      color: #c8b9ff;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      padding: 0;
    }
    .preview-link:hover { color: var(--accent-2); }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 7, 11, 0.92);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content
